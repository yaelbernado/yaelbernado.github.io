<style>
#yb{--bg:#050505;--r:#e10600;--ease:cubic-bezier(.77,0,.18,1);position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:2147483000;overflow:hidden;overflow:clip;background:var(--bg);color:#eee;font:12px/1.4 "Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;user-select:none;-webkit-user-select:none;overscroll-behavior:none}

#yb .view{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .7s}
#yb .view.on{opacity:1;pointer-events:auto}

#intro{position:absolute;inset:0;z-index:250;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--r);transition:opacity .8s;overflow:hidden;cursor:pointer}
#intro b{font-size:clamp(34px,9.5vw,170px);font-weight:400;letter-spacing:-.04em;line-height:.95;text-align:center;position:relative;z-index:2}

#hd{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;padding:24px 32px}

#hd nav a.on,#hd a:hover{color:var(--r)}
#logo{color:var(--r)}

#stage{position:absolute;inset:0;background:#050505}

@keyframes kb{to{transform:scale(1.12)}}
#stage::after{content:"";position:absolute;inset:0;background:var(--r);mix-blend-mode:multiply;transition:opacity 1.8s ease;pointer-events:none}

#yb .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-transform:uppercase;letter-spacing:-.05em;line-height:.84;text-align:center;white-space:nowrap}

#seg{position:absolute;left:32px;right:32px;bottom:24px;z-index:5;display:flex;gap:6px}

#yb .ih b{color:var(--r);font-weight:400}

#yb .ir{display:grid;grid-template-columns:56px 1fr auto;align-items:baseline;padding:14px 0;border-top:1px solid #1d1d1d;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .7s var(--ease),color .3s,padding .5s var(--ease)}
#idx.on .ir{opacity:1;transform:none;transition-delay:var(--d),var(--d),0s,0s}
#yb .ir b{font-weight:400;color:#666}
#yb .ir span{font-size:clamp(22px,3.6vw,54px);letter-spacing:-.04em;text-transform:none;line-height:1}
#yb .ir em{font-style:normal;color:#777}
#il:hover .ir:not(:hover){color:#555}
#yb .ir:hover{color:var(--r);padding-left:14px}
#yb .ir:hover b,#yb .ir:hover em{color:var(--r)}

#det{position:absolute;inset:0;z-index:120;background:var(--bg);display:grid;grid-template-columns:30% 1fr;visibility:hidden;opacity:0;transition:opacity .6s,visibility .6s}
#det.on{visibility:visible;opacity:1}
#yb .dl{padding:90px 32px 32px;display:flex;flex-direction:column;gap:14px;min-height:0}
#yb .dl small{color:var(--r)}
#dt{font-size:clamp(28px,4vw,60px);font-weight:400;letter-spacing:-.03em;text-transform:none;line-height:1;overflow-wrap:anywhere}
#dm{color:var(--r)}
#dd{color:#aaa;text-transform:none;font-size:14px;letter-spacing:0;line-height:1.5}
#yb .nv{margin-top:auto}
#yb .nv a{margin-right:20px}
#yb .nv a:hover{color:var(--r)}
#yb .dr{display:flex;flex-direction:column;padding:80px 32px 28px 0;min-height:0}
#dv{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0b0b}
#dv>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) brightness(.45) contrast(1.4);transition:filter 2.4s ease}
#dv::after{content:"";position:absolute;inset:0;background:var(--r);mix-blend-mode:multiply;transition:opacity 2.4s ease;pointer-events:none}
#dv.dev>*{filter:none}
#dv.dev::after{opacity:0}
#pl{display:none;align-items:center;gap:18px;margin-top:14px;color:#ddd}
#pl button:hover{color:#fff;text-decoration:underline}
#bar{flex:1;height:3px;background:#444;position:relative;cursor:pointer}
#bar::before{content:"";position:absolute;inset:-10px 0}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;pointer-events:none}
#tm{min-width:34px;font-variant-numeric:tabular-nums}

@media(max-width:800px){
  #det{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  #yb .dr{padding:0 20px 20px}#yb .dl{padding:80px 20px 14px}#yb .nv{margin-top:6px}
  #yb #dv{flex:none;height:62vw;min-height:220px}
  #hd{padding:18px 20px}#hd nav a{margin-left:18px}
  #hud{left:20px;right:20px;bottom:40px;flex-direction:column;align-items:flex-start;gap:14px}
  #hud .r a{margin:0 18px 0 0}
  #seg{left:20px;right:20px}
  #yb .big,#yb .sv,#contact p{left:20px}#yb .mail{left:20px;right:20px}
  #idx{padding:80px 20px 20px}
  #yb .ir{grid-template-columns:36px 1fr}#yb .ir em{display:none}
}
@media(prefers-reduced-motion:reduce){#yb *{animation:none!important}}
</style>

<script>
(function(){
function boot(){
var root=document.getElementById("yb");
if(!root){root=document.createElement("div");root.id="yb"}
["glow","cur","intro","hd","home","about","contact","idx","det"].forEach(function(id){var e=document.getElementById(id);if(e&&e.parentNode!==root)root.appendChild(e)});
document.documentElement.appendChild(root);
[].forEach.call(document.querySelectorAll("#yb"),function(x){if(x!==root)x.parentNode.removeChild(x)});
var P=[
 {t:"Statues",y:"2026",c:"Cinematic Art",d:"A short but cinematic film about how good our old statues were",m:"media/statues.mp4"},
 {t:"Street Factory",y:"2026",c:"Slow Shutter Footage",d:"A project that captures the beauty of Slow Shutter, such an incredible way to feel the light trails from the street and people around",m:"media/street-factory.mp4"},
 {t:"Understanding",y:"2026",c:"Cinematic",d:"A melancholic but sensitive project that leaves you with a void inside",m:"media/understanding.mp4"},
 {t:"Figure it out",y:"2025",c:"Grunge cinematic",d:"A cinematic & intense grunge film that captures the alternative style in a Y2K way",m:"media/figure-it-out.mp4"},
 {t:"Return to zero",y:"2025",c:"Cinematic Design",d:"Stylized old money vibes, a project that captures fashion and elegance on the same path",m:"media/return-to-zero.mp4"},
 {t:"Cinematics V1",y:"2025",c:"Experimental",d:"A project that started as an experiment but ended up capturing immaculate vibes, feel free to enter into a space where you can fly",m:"media/cinematics-v1.mp4"},
 {t:"Cinematics V2",y:"2025",c:"Experimental v2",d:"Started as a project as well, ended up giving those street lonely vibes",m:"media/cinematics-v2.mp4"},
 {t:"Dirty",y:"2025",c:"Collage",d:"After an editing block, this project saved me, just a flow state within the music and the images, such a collage art, as well you can see how the vibes can be captured just by images that move",m:"media/dirty.mp4"},
 {t:"Kisses",y:"2025",c:"Visuals",d:"Pixelated Kisses is a project that was made in around 1 hour, simple visuals that match and fit with the vibes the song is giving",m:"media/kisses.mp4"},
 {t:"LV Sandals",y:"2025",c:"Street cinema",d:"One of the first projects that started this journey, a mix of amazing clips and also made a crazy color correction",m:"media/lv-sandals.mp4"}
];
var ABOUT="Freelance <em>video editor</em>, <em>motion designer</em> and <em>UX/UI designer</em> based near Barcelona. More than 9 years chasing light, rhythm and a little bit of the void to turn raw footage into stories you can feel.";

var LOGO="YAEL BERNADÓ";
var INTRO=["Getting into","the void"];
var SERVICES=["Video editing","Motion graphics","UX/UI design","Graphic design"];
var EMAIL="woorkyael@gmail.com";
var LINKS=[["Instagram","https://www.instagram.com/whxiite/"]];

var $=function(s){return root.querySelector(s)},$$=function(s){return root.querySelectorAll(s)};
var VID=/\.(mp4|webm|mov)(\?.*)?$/i,tn=["#444","#3a2222","#222a33","#332a22","#2a2a2a","#2b2233"];
function z(n){return("0"+n).slice(-2)}
function esc(c){return c=="&"?"&amp;":c=="<"?"&lt;":c==" "?"&nbsp;":c}
function media(p,i){
  if(!p.m)return'<div style="background:linear-gradient(150deg,'+tn[i%6]+',#050505)"></div>';
  return VID.test(p.m)?'<video src="'+p.m+'" autoplay muted loop playsinline></video>':'<img src="'+p.m+'" alt="'+p.t+'">';
}

var cur=-1,LN=[],wl=0,sx=0,sy=0,moved=0;
function fit(l){var L=Math.max.apply(null,l.map(function(x){return x.length}));return Math.min(innerWidth*.92/(L*.66),innerHeight*.66/(l.length*.84),innerWidth*.26)}
function build(el,l){el.style.fontSize=fit(l)+"px";el.innerHTML=l.map(function(t,k){return'<div>'+t.split("").map(function(c,j){return'<i style="transition-delay:'+(k*.12+j*.05)+'s">'+esc(c)+'</i>'}).join("")+'</div>'}).join("")}
$("#seg").innerHTML=P.map(function(){return"<i></i>"}).join("");
function snapSwap(el,html){el.classList.add("snap");el.classList.remove("dev");el.innerHTML=html;void el.offsetWidth;el.classList.remove("snap")}
function show(i){
  cur=(i+P.length)%P.length;var p=P[cur],w=p.t.split(" ");lock=true;wl=Date.now();
  LN=(w.length>1&&p.t.length>10)?[w[0],w.slice(1).join(" ")]:[p.t];
  ["#mask","#out"].forEach(function(s){var e=$(s);e.classList.remove("in");build(e,LN)});
  var st=$("#stage");snapSwap(st,media(p,cur));
  $("#hn").textContent=z(cur+1)+" / "+z(P.length);$("#hc").textContent=p.c+" · "+p.y;
  $$("#seg i").forEach(function(x,k){x.classList.toggle("on",k<=cur)});
  setTimeout(function(){["#mask","#out"].forEach(function(s){$(s).classList.add("in")});st.classList.add("dev")},40);
  var nx=P[(cur+1)%P.length];if(nx.m&&!VID.test(nx.m))(new Image()).src=nx.m;
}
function homeOn(){return $("#home").classList.contains("on")&&!$("#det").classList.contains("on")&&!$("#idx").classList.contains("on")&&$("#intro").classList.contains("done")}
var lw=0,lock=true;
addEventListener("wheel",function(e){var d=e.deltaY+e.deltaX,t=Date.now(),gap=t-lw;lw=t;
  if(!homeOn()||cur<0)return;
  if(lock){if(gap>160&&t-wl>600)lock=false;else return}
  if(Math.abs(d)<8)return;
  show(cur+(d>0?1:-1))},{passive:true});
addEventListener("keydown",function(e){
  if(e.key=="Escape"){closeIdx();closeDet();return}
  if($("#det").classList.contains("on")){
    if(e.key=="ArrowLeft")openDet((cur-1+P.length)%P.length);if(e.key=="ArrowRight")openDet((cur+1)%P.length);return}
  if(!homeOn()||cur<0)return;
  if(e.key=="ArrowRight"||e.key=="ArrowDown")show(cur+1);
  if(e.key=="ArrowLeft"||e.key=="ArrowUp")show(cur-1);
  if(e.key=="Enter"&&!e.target.closest("a,button"))openDet(cur)});
$("#home").addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;moved=0});
$("#home").addEventListener("pointerup",function(e){
  var dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(Math.abs(dx),Math.abs(dy));
  if(!homeOn()||cur<0||moved<60||e.target.closest("a,button,#seg"))return;
  var d=Math.abs(dx)>Math.abs(dy)?dx:dy;show(cur+(d<0?1:-1))});
$("#home").addEventListener("click",function(e){if(cur<0||e.target.closest("a,#seg"))return;if(moved<10)openDet(cur)});
$("#seg").onclick=function(e){var k=[].indexOf.call(this.children,e.target);if(k>-1)show(k)};
$("#hp").onclick=function(){show(cur-1)};$("#hx").onclick=function(){show(cur+1)};$("#hv").onclick=function(){openDet(cur)};
addEventListener("resize",function(){if(cur>=0)["#mask","#out"].forEach(function(s){$(s).style.fontSize=fit(LN)+"px"})});

var cats=["All"];P.forEach(function(p){if(cats.indexOf(p.c)<0)cats.push(p.c)});
$("#if").innerHTML=cats.map(function(c,k){return'<a data-f="'+(k?c:"all")+'"'+(k?"":' class="on"')+'>'+c+'</a>'}).join("");
function renderIdx(f){var k=0,h="";P.forEach(function(p,i){if(f=="all"||p.c==f){h+='<div class="ir" data-i="'+i+'" style="--d:'+(k++*.04)+'s"><b>'+z(i+1)+'</b><span>'+p.t+'</span><em>'+p.c+' · '+p.y+'</em></div>'}});
  $("#il").innerHTML=h;$("#ic").textContent=k+(k==1?" project":" projects")}
renderIdx("all");
$("#if").onclick=function(e){var a=e.target.closest("a");if(!a)return;$$("#if a").forEach(function(x){x.classList.remove("on")});a.classList.add("on");renderIdx(a.dataset.f)};
$("#il").onclick=function(e){var r=e.target.closest(".ir");if(r){closeIdx();show(+r.dataset.i)}};
function openIdx(){$("#idx").classList.add("on")}function closeIdx(){$("#idx").classList.remove("on")}
$("#hi").onclick=openIdx;$("#ix").onclick=closeIdx;

var cx=0,cy=0,tx=0,ty=0,cu=$("#cur");
addEventListener("mousemove",function(e){tx=e.clientX;ty=e.clientY;root.style.setProperty("--mx",tx+"px");root.style.setProperty("--my",ty+"px")});
(function cf(){cx+=(tx-cx)*.22;cy+=(ty-cy)*.22;cu.style.transform="translate("+cx+"px,"+cy+"px)";requestAnimationFrame(cf)})();
root.addEventListener("mouseover",function(e){cu.classList.toggle("hot",!!(e.target.closest&&e.target.closest("a,button,#bar,.ir,#seg i")))});

var vid=null,dvT;
function openDet(i){cur=i;var p=P[i];clearTimeout(dvT);
  snapSwap($("#dv"),media(p,i));
  $("#dn").textContent=z(i+1)+" / "+z(P.length);$("#dt").textContent=p.t;$("#dm").textContent=p.c+" · "+p.y;$("#dd").textContent=p.d;
  vid=$("#dv video");$("#pl").style.display=vid?"flex":"none";
  if(vid){vid.ontimeupdate=function(){$("#fill").style.width=(vid.currentTime/vid.duration*100||0)+"%";$("#tm").textContent=Math.floor(vid.currentTime/60)+":"+z(Math.floor(vid.currentTime%60))};$("#pp").textContent="PAUSE";$("#sn").textContent="SOUND"}

function closeDet(){if(!$("#det").classList.contains("on"))return;$("#det").classList.remove("on");if(vid)vid.pause();dvT=setTimeout(function(){$("#dv").innerHTML="";vid=null},700)}
$("#pp").onclick=function(){if(!vid)return;if(vid.paused){vid.play();this.textContent="PAUSE"}else{vid.pause();this.textContent="PLAY"}};
$("#sn").onclick=function(){if(!vid)return;vid.muted=!vid.muted;this.textContent=vid.muted?"SOUND":"MUTE"};
$("#bar").onclick=function(e){if(vid&&vid.duration)vid.currentTime=vid.duration*(e.offsetX/this.offsetWidth)};
$("#dc").onclick=closeDet;$("#dp").onclick=function(){openDet((cur-1+P.length)%P.length)};$("#dx").onclick=function(){openDet((cur+1)%P.length)};

$("#ab").innerHTML=ABOUT;
function put(sel,fn){try{var e=$(sel);if(e)fn(e)}catch(x){}}
put("#logo",function(e){e.textContent=LOGO});
put("#sv",function(e){e.innerHTML=SERVICES.map(function(s,i){return"<li><b>"+z(i+1)+"</b>"+s+"</li>"}).join("")});
put("#ml",function(e){e.href="mailto:"+EMAIL;e.textContent=EMAIL});
put("#lk",function(e){e.innerHTML=LINKS.map(function(l){return'<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+' ↗</a>'}).join("")});
put("#it",function(e){e.innerHTML=INTRO.map(function(t,k){return"<div>"+t.split("").map(function(c,j){return'<i style="transition-delay:'+(k*.3+j*.05)+'s">'+esc(c)+"</i>"}).join("")+"</div>"}).join("");
  setTimeout(function(){e.classList.add("in")},150)});
function go(v){$$(".view").forEach(function(s){s.classList.toggle("on",s.id==v)});
  $$("#hd nav a").forEach(function(a){a.classList.toggle("on",a.dataset.v==v)});closeDet();closeIdx()}
$$("[data-v]").forEach(function(a){a.onclick=function(){go(a.dataset.v)}});

var n=0,started=0,iv;
function start(){if(started)return;started=1;clearInterval(iv);$("#ip").textContent="100";
  setTimeout(function(){$("#intro").classList.add("flash");setTimeout(function(){$("#intro").classList.add("done");show(0)},950)},250)}
iv=setInterval(function(){n=Math.min(100,n+Math.ceil(Math.random()*6));$("#ip").textContent=("00"+n).slice(-3);if(n>=100)start()},38);
$("#intro").onclick=start;setTimeout(start,6000);
}
var tries=0;(function wait(){if(document.getElementById("home"))boot();else if(tries++<200)setTimeout(wait,50)})();
})();
</script>
